<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundStation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/SRIKAR-B-S-S/SoundStation/main/assets/SoundStation.ico" type="image/x-icon">
</head>
<body>

<main>
    <!-- Added a window for showing the list of soundtracks below! -->
    <div class="win-box win-tracks">
    <div class="win-header">
        <span class="win-title">Soundtracks</span>
        <div class="win-controls">
            <span class="win-btn">–</span>
            <span class="win-btn">☐</span>
            <span class="win-btn close-btn">✕</span>
        </div>
        </div>
    <div class="win-body">
        <ul class="track-list"> <!-- I've added the ist of soundtracks here, inspired from the Background Noises feature on my Lenovo Tab -->
            <li><span class="key-badge">1</span>Rain<input type="checkbox" id="chck-1" disabled></li>
            <li><span class="key-badge">2</span>Forest<input type="checkbox" id="chck-2" disabled></li>
            <li><span class="key-badge">3</span>Night<input type="checkbox" id="chck-3" disabled></li>
            <li><span class="key-badge">4</span>Dawn<input type="checkbox" id="chck-4" disabled></li>
            <li><span class="key-badge">5</span>Ocean<input type="checkbox" id="chck-5" disabled></li>
            <li><span class="key-badge">6</span>Campfire<input type="checkbox" id="chck-6" disabled></li>
            <li><span class="key-badge">7</span>Cicada<input type="checkbox" id="chck-7" disabled></li>
            <li><span class="key-badge">8</span>Birds<input type="checkbox" id="chck-8" disabled></li>
            <li><span class="key-badge">9</span>Farm<input type="checkbox" id="chck-9" disabled></li>
        </ul>
    </div>
</div>

    <div class="win-box win-clock"> <!-- Added a window(named it as win-box) which will display Date and Time, actually this is not the main feature of my project, so I shouldn't be adding this first but I just thought to start with the simple feature -->
        <div class="win-header">
        <span class="win-title">System Time</span>
            <div class="win-controls">
            <span class="win-btn">–</span>
            <span class="win-btn">☐</span>
            <span class="win-btn close-btn">✕</span>
            </div>
        </div>

    <div class="win-body clock-body">
        <!-- The time will be displayed here from JS using the IDs of both the divs -->
        <div class="time-text" id="time-display">12:00 AM</div>
        <div id="date-display" class="date-text">Sunday, Sep 27, 2026</div>
    </div>
</div>

<!-- Added a new window for displaying the main audio controls and a spinning vinyl gif-->
<div class="win-box win-player">
    <div class="win-header">
        <span class="win-title">Media Player</span>
        <div class="win-controls">
            <span class="win-btn">–</span>
            <span class="win-btn">☐</span>
            <span class="win-btn close-btn">✕</span>
        </div>
    </div>

    <div class="win-body player-body">
        <img id="vinyl-gif" src="https://raw.githubusercontent.com/SRIKAR-B-S-S/SoundStation/main/assets/SoundStation-spinning-vinyl.gif" class="vinyl-img paused"> <!-- Thanks to this website for the gif! - https://www.omnigif.com/gif-maker/vinyl-spinning-gif-maker -->

    <div class="controls-row"> <!--Three main controls play/pause and volume+- with their respective key hint below their buttons-->
        <div class="btn-group">
            <div class="media-control">
                <button class="media-button">Vol-</button>
                <span class="key-hint">down arrow</span>
            </div>
            <div class="media-control">
                <button id="play-button" class="media-button">Play</button>
                <span class="key-hint">spacebar</span>
            </div>
            <div class="media-control">
                <button class="media-button">Vol+</button>
                <span class="key-hint">up arrow</span>
            </div>
        </div>
    </div>

    <div class="volume-status">Volume: <b><span id="vol-level">80</span>%</b></div>
    </div>
</div>

</main>
<script src="script.js"></script>
</body>
</html>
